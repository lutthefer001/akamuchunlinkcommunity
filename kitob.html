<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Interaktiv kitob</title>
<link rel="stylesheet" href="/style.css" />
<style>
  :root{--wood:#a86f3d;--paper:#fdfcf9;--ink:#161616}
  body.book-page{overflow:hidden;background:#6f431f}
  .book-topbar{position:fixed;inset:0 0 auto 0;height:58px;z-index:20;display:flex;align-items:center;gap:14px;padding:0 14px;background:linear-gradient(180deg,rgba(0,0,0,.92),rgba(0,0,0,.65));border-bottom:1px solid rgba(255,255,255,.09);backdrop-filter:blur(12px)}
  .book-topbar a,.book-topbar button{font:inherit;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);padding:9px 12px;border-radius:10px;cursor:pointer}
  .book-topbar .spacer{flex:1}
  .book-topbar .counter{font-size:13px;color:#dbe4ed;min-width:80px;text-align:center}
  .book-stage-wrap{position:fixed;inset:58px 0 0;display:grid;place-items:center;overflow:hidden}
  .wood{position:absolute;inset:0;background:
    radial-gradient(1200px 700px at 20% 18%,rgba(255,245,215,.22),transparent 60%),
    radial-gradient(800px 600px at 80% 65%,rgba(79,28,6,.18),transparent 55%),
    repeating-linear-gradient(0deg,rgba(91,43,16,.18) 0 2px,transparent 2px 86px),
    repeating-linear-gradient(90deg,rgba(73,35,11,.12) 0 2px,transparent 2px 120px),
    linear-gradient(135deg,#bd8650,#8f592e 48%,#71431f);}
  .wood:before,.wood:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:
    radial-gradient(ellipse at 15% 86%,#31552b 0 2.8%,transparent 3%),
    radial-gradient(ellipse at 83% 10%,#31552b 0 3.2%,transparent 3%),
    radial-gradient(ellipse at 10% 15%,#2d4f26 0 2.5%,transparent 2.6%),
    radial-gradient(ellipse at 93% 74%,#31552b 0 3.2%,transparent 3%);filter:blur(.4px)}
  .wood:after{transform:scaleX(-1);opacity:.28}
  .reader-shell{position:relative;width:min(1180px,94vw);height:min(77vh,760px);display:grid;place-items:center;filter:drop-shadow(0 35px 45px rgba(0,0,0,.35))}
  .reader-shell:before{content:"";position:absolute;width:68%;height:8%;bottom:1%;border-radius:50%;background:rgba(0,0,0,.3);filter:blur(24px)}
  #book-container{position:relative;width:min(980px,82vw);height:min(700px,72vh);}
  #book{position:absolute;inset:0}
  .page{background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);overflow:hidden}
  .page canvas{display:block;width:100%;height:100%}
  .page.--hard{background:#eee}
  .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:15;color:#f3eee7;font-size:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);padding:8px 12px;border-radius:999px;backdrop-filter:blur(8px);white-space:nowrap}
  .controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:8px}
  .controls button{border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.46);color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;backdrop-filter:blur(10px)}
  .controls button:hover{background:rgba(0,0,0,.62)}
  .loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.18);backdrop-filter:blur(2px);z-index:10;font-size:14px}
  @media(max-width:800px){#book-container{width:92vw;height:72vh}.reader-shell{width:100vw}.controls{bottom:10px}.hint{font-size:11px;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.book-topbar{height:52px}.book-stage-wrap{inset:52px 0 0}}
</style>
</head>
<body class="book-page">
  <div class="book-topbar">
    <a href="/">←</a>
    <a href="/slayd">Slayd</a>
    <a href="/site">Site</a>
    <div class="spacer"></div>
    <span class="counter" id="counter">0 / 0</span>
    <button id="soundBtn" type="button">🔊</button>
    <button id="fullBtn" type="button">⛶</button>
  </div>

  <main class="book-stage-wrap" id="stageWrap">
    <div class="wood"></div>
    <div class="reader-shell">
      <div id="book-container"><div id="book"></div><div class="loading" id="loading">Kitob yuklanmoqda…</div></div>
    </div>
    <div class="hint">Sahifaning o‘ng yoki chap tomonini bosing • Sichqoncha bilan torting • ← →</div>
  </main>

  <div class="controls">
    <button id="prevBtn">← Oldingi</button>
    <button id="nextBtn">Keyingi →</button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script type="module">
  const PDF_URL='/kitob.pdf';
  const bookEl=document.getElementById('book');
  const loading=document.getElementById('loading');
  const counter=document.getElementById('counter');
  const soundBtn=document.getElementById('soundBtn');
  const stageWrap=document.getElementById('stageWrap');
  let soundOn=true;
  let pageFlip=null;
  let totalPages=0;

  async function createPage(pdf,pageNum){
    const p=await pdf.getPage(pageNum);
    const base=1.55;
    const viewport=p.getViewport({scale:base});
    const canvas=document.createElement('canvas');
    canvas.width=Math.ceil(viewport.width);
    canvas.height=Math.ceil(viewport.height);
    const ctx=canvas.getContext('2d',{alpha:false});
    await p.render({canvasContext:ctx,viewport}).promise;
    const el=document.createElement('div');
    el.className='page';
    el.dataset.page=pageNum;
    el.appendChild(canvas);
    return el;
  }

  // A layered page-rustle sound: paper air/noise + short snap.
  let audioCtx=null;
  function paperSound(){
    if(!soundOn)return;
    try{
      audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      const t=audioCtx.currentTime;
      const noise=audioCtx.createBufferSource();
      const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*.22,audioCtx.sampleRate);
      const data=buffer.getChannelData(0);
      for(let i=0;i<data.length;i++){
        const env=Math.max(0,1-i/data.length);
        data[i]=(Math.random()*2-1)*env*0.22;
      }
      noise.buffer=buffer;
      const filter=audioCtx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=1500;filter.Q.value=.65;
      const gain=audioCtx.createGain();gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(.15,t+.025);gain.gain.exponentialRampToValueAtTime(.0001,t+.2);
      noise.connect(filter).connect(gain).connect(audioCtx.destination);noise.start(t);

      const click=audioCtx.createOscillator();
      const clickGain=audioCtx.createGain();
      click.type='triangle';click.frequency.setValueAtTime(900,t+.02);click.frequency.exponentialRampToValueAtTime(220,t+.14);
      clickGain.gain.setValueAtTime(.0001,t+.02);clickGain.gain.exponentialRampToValueAtTime(.035,t+.035);clickGain.gain.exponentialRampToValueAtTime(.0001,t+.14);
      click.connect(clickGain).connect(audioCtx.destination);click.start(t+.02);click.stop(t+.15);
    }catch{}
  }

  async function init(){
    try{
      // browser import works even though the script tag is module; use dynamic import for compatibility.
      const pdfjsLib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
      const pdf=await pdfjsLib.getDocument(PDF_URL).promise;
      totalPages=pdf.numPages;counter.textContent=`1 / ${totalPages}`;

      const pages=[];
      for(let i=1;i<=totalPages;i++){
        pages.push(await createPage(pdf,i));
      }
      pages.forEach(p=>bookEl.appendChild(p));

      pageFlip=new St.PageFlip(bookEl,{
        width:540,
        height:720,
        size:'stretch',
        minWidth:260,
        maxWidth:610,
        minHeight:360,
        maxHeight:850,
        drawShadow:true,
        maxShadowOpacity:.36,
        showCover:true,
        flippingTime:900,
        usePortrait:true,
        startPage:0,
        startZIndex:0,
        autoSize:true,
        clickEventForward:true,
        useMouseEvents:true,
        mobileScrollSupport:true,
        swipeDistance:30,
        showPageCorners:true,
      });
      pageFlip.loadFromHTML(document.querySelectorAll('.page'));
      pageFlip.on('flip',e=>{
        const current=e.data+1;
        counter.textContent=`${current} / ${totalPages}`;
        paperSound();
      });
      pageFlip.on('changeState',e=>{
        document.body.classList.toggle('is-flipping', e.data==='flipping');
      });
      loading.remove();
    }catch(err){
      console.error(err);
      loading.textContent='Kitobni yuklashda xatolik yuz berdi. kitob.pdf fayli mavjudligini tekshiring.';
    }
  }
  document.getElementById('prevBtn').onclick=()=>pageFlip?.flipPrev();
  document.getElementById('nextBtn').onclick=()=>pageFlip?.flipNext();
  soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇';if(soundOn) paperSound()};
  document.getElementById('fullBtn').onclick=()=>stageWrap.requestFullscreen?.();
  window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')pageFlip?.flipNext();if(e.key==='ArrowLeft')pageFlip?.flipPrev()});
  init();
</script>
</body>
</html>
